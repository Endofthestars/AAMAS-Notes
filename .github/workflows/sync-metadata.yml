name: Sync conference metadata

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      year:
        description: Year to synchronize
        type: choice
        required: true
        default: all
        options:
          - all
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"

permissions:
  contents: write

concurrency:
  group: sync-metadata-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronize configured metadata sources
        id: synchronize
        continue-on-error: true
        env:
          SYNC_YEAR: ${{ inputs.year || 'all' }}
        run: |
          sync_failed=0
          if [[ "$SYNC_YEAR" == "2026" ]]; then
            python3 scripts/sync_ifaamas.py || sync_failed=1
          elif [[ "$SYNC_YEAR" == "all" ]]; then
            python3 scripts/sync_dblp.py || sync_failed=1
            python3 scripts/sync_ifaamas.py || sync_failed=1
          else
            python3 scripts/sync_dblp.py --year "$SYNC_YEAR" || sync_failed=1
          fi
          exit "$sync_failed"
      - run: python3 scripts/validate_repository.py
      - name: Publish synchronization branch
        env:
          SYNC_YEAR: ${{ inputs.year || 'all' }}
          BRANCH: automation/metadata-sync-${{ inputs.year || 'all' }}
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "Conference metadata is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add data/
          git commit -m "chore(data): sync AAMAS metadata"
          git push --force-with-lease origin "HEAD:$BRANCH"
          {
            echo "Synchronization branch published: \`$BRANCH\`"
            echo
            echo "A maintainer can open the PR with:"
            echo "\`gh pr create --base main --head $BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete upstream synchronization
        if: steps.synchronize.outcome == 'failure'
        run: |
          echo "At least one metadata source failed; successful snapshots were preserved."
          exit 1
