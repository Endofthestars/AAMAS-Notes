name: Deploy Paper Notes UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "docs/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "scripts/generate_site_indexes.py"
      - "scripts/sync_paper_notes_docs.sh"
      - "data/provenance/PAPER_NOTES_UPSTREAM.md"
      - "data/provenance/PAPER_NOTES_UPSTREAM_DIRS.txt"
      - "third_party/Paper-Notes/LICENSE"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/sync-paper-notes-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install mkdocs-material
      - run: python3 scripts/generate_site_indexes.py
      # The mirrored Paper-Notes corpus contains unresolved upstream links.
      # MkDocs still validates and renders every page; warnings remain visible.
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
