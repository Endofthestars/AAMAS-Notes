name: Deploy Paper Notes UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "docs/*.md"
      - "docs/notes/**"
      - "docs/stylesheets/**"
      - "docs/javascripts/**"
      - "docs/assets/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "scripts/generate_site_indexes.py"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install mkdocs-material
      - run: python3 scripts/generate_site_indexes.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
