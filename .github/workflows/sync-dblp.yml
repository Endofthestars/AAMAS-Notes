name: Sync DBLP metadata

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-dblp-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronize configured DBLP sources
        id: synchronize
        continue-on-error: true
        run: python3 scripts/sync_dblp.py
      - run: python3 scripts/validate_repository.py
      - name: Create or update synchronization pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/dblp-sync
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "DBLP metadata is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add data/
          git commit -m "chore(data): sync DBLP metadata"
          git push --force-with-lease origin "HEAD:$BRANCH"
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): sync DBLP metadata" \
              --body "Automated weekly AAMAS metadata synchronization from configured DBLP exports."
          fi
      - name: Report incomplete upstream synchronization
        if: steps.synchronize.outcome == 'failure'
        run: |
          echo "At least one DBLP year failed; successful yearly snapshots were preserved."
          exit 1
